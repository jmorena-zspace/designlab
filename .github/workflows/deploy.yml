# Publishes the site to GitHub Pages every time something is pushed to the main branch.
# (You can also run it by hand from the Actions tab: "Run workflow".)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# What this workflow is allowed to do with your repository.
permissions:
  contents: read
  pages: write
  id-token: write

# If two deploys start at once, let the running one finish and only keep the newest waiting.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
